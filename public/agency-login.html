<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Login - InvestInPuglia.eu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ecf0f1;
        }

        .divider span {
            background: white;
            padding: 0 20px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .features {
            background: #f8f9fa;
            margin: 30px -40px -40px -40px;
            padding: 30px 40px;
            border-radius: 0 0 15px 15px;
        }

        .features h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .features ul {
            list-style: none;
            font-size: 14px;
        }

        .features li {
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
            color: #34495e;
        }

        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #2ecc71;
            font-weight: bold;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .remember-me input {
            width: auto;
            margin: 0;
        }

        .remember-me label {
            font-weight: normal;
            margin: 0;
            font-size: 14px;
            color: #34495e;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 10px;
                padding: 30px 20px;
            }
            
            .features {
                margin: 30px -20px -30px -20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏛️ InvestInPuglia.eu</h1>
            <p>Agency Dashboard Login</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your.email@agency.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>

            <div class="forgot-password">
                <a href="/forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Login to Dashboard</button>
        </form>

        <div class="divider">
            <span>New to InvestInPuglia.eu?</span>
        </div>

        <div class="register-link">
            <a href="/register">Create Agency Account</a>
        </div>

        <div class="features">
            <h3>🚀 Access Your Dashboard To:</h3>
            <ul>
                <li>Upload Mini PIA properties</li>
                <li>Manage international inquiries</li>
                <li>View property analytics</li>
                <li>Access investor database</li>
                <li>Download reports</li>
            </ul>
        </div>
    </div>

    <script>
        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Basic validation
            if (!email || !password) {
                alert('Please enter both email and password!');
                return;
            }
            
            // Here you would normally authenticate with your backend/Firebase
            console.log('Login attempt:', { email, password, remember });
            
            // For demo purposes, simulate login
            if (email && password) {
                alert('Login successful! Redirecting to dashboard...');
                // Redirect to dashboard
                window.location.href = '/dashboard';
            } else {
                alert('Invalid credentials. Please try again.');
            }
        });

        // Remember email if previously stored
        window.addEventListener('load', function() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('remember').checked = true;
            }
        });

        // Store email if remember me is checked
        document.getElementById('remember').addEventListener('change', function() {
            if (this.checked) {
                const email = document.getElementById('email').value;
                if (email) {
                    localStorage.setItem('rememberedEmail', email);
                }
            } else {
                localStorage.removeItem('rememberedEmail');
            }
        });
    </script>
</body>
</html>
